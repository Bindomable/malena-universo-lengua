<body><header><a class="brand" href="#inicio"><span class="brand-icon">✦</span> UNIVERSO <b>LENGUA</b></a><span class="profile">M <span>Malena</span></span></header><div class="shell"><aside><p class="eyebrow">TU ESPACIO DE APRENDIZAJE</p><nav aria-label="Navegación principal"><a href="#inicio">⌂ <span>Mi universo</span></a><a href="#teoria">▤ <span>Explorar teoría</span></a><a href="#practica">✧ <span>Laboratorio</span></a><a href="#examen">⚑ <span>Reto final</span></a><a href="#progreso">◉ <span>Mis logros</span></a></nav><div class="side-note"><span>✦</span><b>Una pista para hoy</b><p>Entender por qué vale más que acertar por suerte.</p></div><small>Hecho para ti, Malena.<br>Un concepto cada vez.</small></aside><main id="main" tabindex="-1"></main></div><div id="toast" role="status" aria-live="polite"></div><footer>Tu progreso se guarda en este navegador. <button class="link" id="export">Guardar copia</button> · <label class="link" for="import">Recuperar copia</label><input id="import" type="file" accept="application/json" hidden><span id="storage-status"></span></footer><script>/* Contenido transcrito y adaptado del PDF de apuntes. Ejemplos originales. */
const CHAPTERS = [
 {id:'com',name:'La comunicación',icon:'☏',color:'mint',desc:'Descubre quién dice qué, a quién y cómo.',tag:'CONECTAR'},
 {id:'txt',name:'Tipos de textos',icon:'▤',color:'peach',desc:'Lee las pistas y descubre la intención.',tag:'DETECTAR'},
 {id:'gen',name:'Géneros literarios',icon:'♧',color:'lavender',desc:'Historias, emociones y escenarios.',tag:'IMAGINAR'},
 {id:'fig',name:'Figuras literarias',icon:'✧',color:'yellow',desc:'Descifra la magia que esconden las palabras.',tag:'DESCIFRAR'}
];
// id, bloque, concepto, definición, ejemplo, explicación, familia
const CONCEPTS = [
 ['comunicacion','com','Comunicación','Actividad social que permite intercambiar información con una intención o finalidad.','Malena pregunta a su profesora cuándo es el examen.','Hay intercambio de información con una finalidad: conocer la fecha.','Conceptos básicos'],
 ['intencion','com','Intención comunicativa','Finalidad o propósito que perseguimos al emitir un mensaje.','«Por favor, cierra la ventana».','La finalidad es pedir que alguien haga algo.','Conceptos básicos'],
 ['emisor','com','Emisor','Elabora y transmite la información.','Una profesora explica una actividad a su clase.','La profesora es quien produce y transmite el mensaje.','Seis elementos'],
 ['receptor','com','Receptor','Recibe e interpreta el mensaje.','La clase escucha la explicación de la profesora.','El alumnado recibe e interpreta la información.','Seis elementos'],
 ['mensaje','com','Mensaje','Información que el emisor hace llegar al receptor.','«Mañana visitaremos el museo».','Lo comunicado es la información sobre la visita.','Seis elementos'],
 ['codigo','com','Código','Conjunto de signos y reglas con los que se construye el mensaje.','Una nota escrita en lengua española.','El código es el español; el papel sería el canal.','Seis elementos'],
 ['contexto','com','Situación o contexto','Conjunto de circunstancias en las que tiene lugar el acto de comunicación.','La profesora habla en clase, justo antes de salir al recreo.','El lugar, el momento y las circunstancias forman el contexto.','Seis elementos'],
 ['canal','com','Canal','Medio físico a través del que se transmite el mensaje.','Malena recibe una carta en papel.','El papel es el soporte por el que llega el mensaje.','Seis elementos'],
 ['narrativo','txt','Narrativo','Cuenta hechos que suceden en un tiempo y un espacio determinados.','Ayer, Lucía entró en la biblioteca y encontró una llave entre dos libros.','Se cuenta una sucesión de hechos situados en un lugar y un momento.','Según la intención'],
 ['descriptivo','txt','Descriptivo','Presenta las cualidades de seres, objetos, fenómenos o realidades. Responde a «¿cómo es?».','La llave era pequeña, plateada y tenía tres dientes torcidos.','Se explica cómo es la llave mediante sus características.','Según la intención'],
 ['dialogado','txt','Dialogado','Reproduce el intercambio de información entre dos o más personas.','—¿Es tuya esta llave?\n—No, pero sé qué puerta abre.','Se reproducen las intervenciones de dos personas.','Según la intención'],
 ['expositivo','txt','Expositivo','Explica un tema para facilitar su conocimiento. Responde a «¿qué es?» o «¿cómo funciona?».','Un eclipse solar se produce cuando la Luna se interpone entre la Tierra y el Sol.','Se explica un fenómeno de manera informativa.','Según la intención'],
 ['argumentativo','txt','Argumentativo','Defiende una opinión mediante razones o argumentos.','Deberíamos ir andando al colegio porque reducimos la contaminación y hacemos ejercicio.','Se defiende una propuesta y se aportan razones.','Según la intención'],
 ['prescriptivo','txt','Prescriptivo','Da normas, instrucciones o consejos para guiar la acción del receptor.','Introduce la llave y gírala hacia la derecha.','Se indica qué pasos debe seguir quien lee.','Según la intención'],
 ['literatura','gen','Literatura','Arte que utiliza la palabra, tanto oral como escrita, como forma de expresión.','Un cuento narrado en voz alta y un poema escrito pueden ser literatura.','La literatura puede transmitirse oralmente o por escrito.','El arte de la palabra'],
 ['lirica','gen','Poesía lírica','Expresa emociones y sentimientos para conmover. En estos apuntes se estudia escrita en verso.','Hoy me pesa tu ausencia,\ny me abraza la soledad.','Lo principal es expresar un sentimiento, no contar una aventura.','Géneros literarios'],
 ['narrativa','gen','Narrativa','Relata hechos que les suceden a unos personajes. En estos apuntes aparece como narrativa en prosa.','El viajero guardó el mapa y siguió su camino hacia el castillo.','Un narrador cuenta lo que hace un personaje. La prosa es una forma de escritura, no un género por sí sola.','Géneros literarios'],
 ['teatro','gen','Teatro o género dramático','Presenta acciones mediante personajes que dialogan en estilo directo. Está pensado para representarse.','LUNA.—¿Quién llama?\nSOL.—Soy yo. (Entra con una linterna).','Intervienen personajes y hay una acotación que orienta la representación.','Géneros literarios'],
 ['mito','gen','Mito','Es una narración literaria.','Según un antiguo relato, una diosa escondió la luz en una montaña y un héroe fue a buscarla.','El ejemplo ayuda a reconocer un mito; la definición que debes memorizar es la breve: «Es una narración literaria».','Narrativa'],
 ['paronomasia','fig','Paronomasia','Emplea palabras de sonido parecido y significado diferente.','Con buena actitud llegarás a gran altitud.','«Actitud» y «altitud» se parecen al sonar, pero significan cosas diferentes.','Sonoras'],
 ['aliteracion','fig','Aliteración','Repite uno o varios sonidos de forma expresiva.','Susi susurra suaves secretos.','Se repite especialmente el sonido /s/.','Sonoras'],
 ['onomatopeya','fig','Onomatopeya','Imita un sonido mediante palabras.','Tic, tac: el reloj seguía despierto.','«Tic, tac» imita el sonido del reloj.','Sonoras'],
 ['derivacion','fig','Derivación','Repite palabras que comparten un mismo lexema o raíz.','Vive la vida con toda su vitalidad.','«Vive», «vida» y «vitalidad» pertenecen a la misma familia léxica.','Sintácticas (según los apuntes)'],
 ['anafora','fig','Anáfora','Repite una o varias palabras al comienzo de versos o enunciados.','Aquí nace el día.\nAquí crece la esperanza.','Se repite «Aquí» al principio de los dos enunciados.','Sintácticas'],
 ['paralelismo','fig','Paralelismo','Repite una misma estructura sintáctica.','Tu voz trae calma.\nMi canto lleva alegría.','Los dos enunciados siguen el esquema: posesivo + nombre + verbo + nombre.','Sintácticas'],
 ['hiperbaton','fig','Hipérbaton','Altera el orden habitual de las palabras en una oración.','Del jardín las flores recogió Ana.','El orden habitual sería: «Ana recogió las flores del jardín».','Sintácticas'],
 ['antitesis','fig','Antítesis','Contrapone palabras o ideas de significado opuesto.','A veces río, a veces lloro.','Se oponen las ideas de reír y llorar.','Semánticas'],

</script><script>'use strict';
const KEY='malena-universo-lengua-v1';
const fresh=()=>({version:1,xp:0,read:[],earned:[],passed:[],review:[],attempts:{},history:[],days:[],session:null});
let state=fresh(),storageOK=true;
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&saved.version===1)state={...fresh(),...saved};}catch(e){storageOK=false;}
const $=s=>document.querySelector(s), main=$('#main');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId=id=>CONCEPTS.find(c=>c.id===id), qById=id=>QUESTIONS.find(q=>q.id===id);
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;};
const today=()=>new Date().toLocaleDateString('en-CA');
const chapterName=id=>CHAPTERS.find(c=>c.id===id).name;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;}$('#storage-status').textContent=storageOK?'':'No se puede guardar automáticamente. Usa «Guardar copia» antes de salir.';}
function activity(){if(!state.days.includes(today()))state.days.push(today());}
function award(key,points){if(!state.earned.includes(key)){state.earned.push(key);state.xp+=points;return points;}return 0;}
function mastered(c){const qs=state.passed.map(qById).filter(q=>q&&q.concept===c.id);return qs.length>=2&&qs.some(q=>q.kind==='aplicacion');}
function masteredIn(ch){return CONCEPTS.filter(c=>(!ch||c.chapter===ch)&&mastered(c)).length;}
function streak(){let n=0,d=new Date();if(!state.days.includes(today()))d.setDate(d.getDate()-1);while(state.days.includes(d.toLocaleDateString('en-CA'))){n++;d.setDate(d.getDate()-1);}return n;}
function bestStreak(){let best=0;for(const day of state.days){let n=0,d=new Date(day+'T12:00:00');while(state.days.includes(d.toLocaleDateString('en-CA'))){n++;d.setDate(d.getDate()-1);}best=Math.max(best,n);}return best;}
function level(){return ['Exploradora','Detective de palabras','Creadora de historias','Guardiana de la lengua','Maestra del universo'][Math.min(4,Math.floor(state.xp/400))];}
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),3200);}
const badgeData=()=>[
 ['🌱','Primer paso','Lee tu primera ficha.',state.read.length>0],
 ['🔎','Primera pista','Resuelve un caso y su razonamiento.',state.passed.some(id=>qById(id)?.kind==='aplicacion')],
 ['📚','Biblioteca completa','Lee las 31 fichas.',state.read.length===CONCEPTS.length],
 ['🔥','Tres días contigo','Estudia tres días seguidos.',bestStreak()>=3],
 ['✨','500 estrellas','Consigue 500 puntos de experiencia.',state.xp>=500],
 ['🏆','Reto superado','Logra al menos un 8 en el reto final.',state.history.some(h=>h.mode==='examen'&&h.score>=8)],
 ...CHAPTERS.map(c=>[c.icon,'Especialista: '+c.name,'Domina todos los conceptos del bloque.',masteredIn(c.id)===CONCEPTS.filter(x=>x.chapter===c.id).length]),

function stats(){return `<div class="stats"><div class="stat"><span class="stat-icon">✧</span><div><strong>${state.xp}</strong><small>puntos de experiencia</small></div></div><div class="stat"><span class="stat-icon">◈</span><div><strong>${masteredIn()}<small> / ${CONCEPTS.length}</small></strong><small>conceptos dominados</small></div></div><div class="stat"><span class="stat-icon">♧</span><div><strong>${badgeData().filter(b=>b[3]).length}</strong><small>insignias desbloqueadas</small></div></div><div class="stat"><span class="stat-icon">♨</span><div><strong>${streak()}</strong><small>días de racha</small></div></div></div>`;}
function chapterCards(){return `<div class="chapter-grid">${CHAPTERS.map((c,i)=>{let total=CONCEPTS.filter(x=>x.chapter===c.id).length,n=masteredIn(c.id);return `<a class="chapter" href="#teoria/${c.id}"><div class="chapter-top"><span class="chapter-icon ${c.color}">${c.icon}</span><div><p class="eyebrow">MISIÓN 0${i+1} · ${c.tag}</p><h3>${c.name}</h3></div></div><p>${c.desc}</p><div class="bar" role="progressbar" aria-label="Dominio de ${c.name}" aria-valuenow="${n}" aria-valuemin="0" aria-valuemax="${total}"><i style="width:${n/total*100}%"></i></div><div class="chapter-bottom"><span>${n} de ${total} conceptos dominados</span><b>Explorar →</b></div></a>`;}).join('')}</div>`;}
function home(){main.innerHTML=`<div class="page-top"><div><p class="eyebrow">PEQUEÑOS PASOS. GRANDES DESCUBRIMIENTOS.</p><h2>Tu aventura de hoy</h2></div><span class="chip">✦ ${level()}</span></div><section class="hero"><div><p class="eyebrow">TU UNIVERSO ESTÁ LLENO DE PALABRAS</p><h1>Hola, Malena.<br>¿Qué descubrimos hoy?</h1><p>Explora ideas, descifra textos y descubre todo lo que ya sabes. Cada intento te lleva un poco más lejos.</p><a class="primary" href="${state.session?'#sesion':'#teoria'}">${state.session?'Continuar mi misión':'Empezar a explorar'} <span>→</span></a></div><div class="hero-art" aria-hidden="true"><span class="star s1">✧</span><span class="star s2">✦</span><span class="star s3">✧</span><div class="planet">✎</div></div></section>${stats()}<div class="section-heading"><h2>Cuatro mundos por descubrir</h2><span class="sub">A tu ritmo, sin prisas</span></div>${chapterCards()}<div class="bottom-banner"><div><span class="tag">EL LABORATORIO DE LAS PALABRAS</span><h3>Entender es poder explicarlo.</h3><p>Prueba textos y frases nuevos. Elige una respuesta y demuestra por qué.</p></div><a class="secondary" href="#practica">Entrar al laboratorio ↗</a></div>${state.review.length?`<div class="notice"><b>Tienes ${state.review.length} preguntas para volver a explorar.</b> Los errores son pistas: puedes repasarlos en el laboratorio.</div>`:''}`;}
function tabs(selected){return `<div class="toolbar"><a class="pill ${!selected?'selected':''}" href="#teoria">Todos los mundos</a>${CHAPTERS.map(c=>`<a class="pill ${selected===c.id?'selected':''}" href="#teoria/${c.id}">${c.name}</a>`).join('')}</div>`;}
function theory(ch){main.innerHTML=`<p class="eyebrow">EXPLORAR · COMPRENDER · RECORDAR</p><h1>Las ideas, bien claras.</h1><p class="sub">Lee, mira el ejemplo y trata de explicarlo con tus palabras antes de abrir la pista.</p>${tabs(ch)}<input class="search" id="search" type="search" placeholder="Buscar: metáfora, receptor, teatro…" aria-label="Buscar conceptos"><div class="notice"><b>Tres preguntas diferentes:</b> «¿Qué tipo de texto es?» → intención. «¿Qué género literario es?» → lírica, narrativa o teatro. «¿Qué figura usa?» → recurso de las palabras. Pueden convivir en un mismo fragmento.</div><div id="cards" class="theory-grid"></div><div class="bottom-banner"><div><h3>Ahora, llévalo a la práctica.</h3><p>Leer una ficha suma experiencia; dominarla exige aplicarla.</p></div><button class="primary" data-start="${ch||'all'}">Practicar este contenido →</button></div>`;
const draw=()=>{$('#cards').innerHTML=CONCEPTS.filter(c=>(!ch||c.chapter===ch)&&(`${c.name} ${c.definition} ${c.family}`.toLocaleLowerCase('es').includes($('#search').value.toLocaleLowerCase('es')))).map(c=>`<article class="theory-card ${state.read.includes(c.id)?'read':''}"><span class="tag">${esc(c.family)}</span><h2>${esc(c.name)} ${mastered(c)?'✓':''}</h2><p>${esc(c.definition)}</p><blockquote>${esc(c.example)}</blockquote><details><summary>¿Por qué es un ejemplo?</summary><p>${esc(c.why)}</p>${c.id==='anafora'||c.id==='paralelismo'?'<p>Una anáfora puede coincidir con un paralelismo. Observa si la pregunta pide una palabra inicial repetida o una estructura.</p>':''}</details><button class="${state.read.includes(c.id)?'secondary':'primary'}" data-read="${c.id}">${state.read.includes(c.id)?'✓ Ficha leída':'Lo he leído · +5 XP'}</button></article>`).join('')||'<p>No hay fichas que coincidan con la búsqueda.</p>';};$('#search').addEventListener('input',draw);draw();}
function practice(){main.innerHTML=`<p class="eyebrow">EL LABORATORIO</p><h1>Las palabras, en acción.</h1><p class="sub">${QUESTIONS.length} preguntas para aprender a reconocer, comparar y razonar. Equivocarse también enseña.</p>${state.session?'<div class="notice"><b>Hay una misión en curso.</b> <a class="link" href="#sesion">Continuar donde lo dejé →</a></div>':''}<section class="practice-panel"><h2>1. Elige tu mundo</h2><div class="toolbar" id="practice-filter"><button class="pill selected" data-filter="all">Todos</button>${CHAPTERS.map(c=>`<button class="pill" data-filter="${c.id}">${c.name}</button>`).join('')}</div><h2>2. Elige cómo entrenar</h2><div class="mode-grid"><button class="mode" data-mode="mix"><span>✦</span><h3>Misión de 10</h3><p>Conceptos y casos prácticos. Una mezcla para conectar lo que sabes.</p></button><button class="mode" data-mode="cases"><span>⌕</span><h3>Detective de textos</h3><p>Solo ejemplos nuevos: identifica y elige la explicación que lo demuestra.</p></button><button class="mode" data-mode="review" ${!state.review.length?'disabled':''}><span>↻</span><h3>Mis pistas pendientes</h3><p>${state.review.length?state.review.length+' preguntas para afianzar. Revisa lo que te costó y vuelve a intentarlo.':'Aquí aparecerán las preguntas que necesites volver a practicar.'}</p></button></div></section><p class="explain">En los casos prácticos hay dos pasos: <b>identificar</b> y <b>razonar</b>. Cada paso correcto suma hasta 10 XP una sola vez. Repetir una pregunta ayuda a aprender, pero no multiplica los puntos. Para dominar un concepto, resuelve dos preguntas diferentes, al menos una práctica, sin errores en sus pasos.</p>`;}
function exam(){main.innerHTML=`<p class="eyebrow">EL GRAN RETO</p><h1>Tu próxima conquista.</h1><p class="sub">Un recorrido completo para comprobar qué sabes aplicar.</p><section class="hero"><div><span class="chip">⚑ RETO FINAL · SIN CRONÓMETRO</span><h1>Cuatro mundos.<br>Una gran misión.</h1><p>20 preguntas: 5 de cada bloque. Combina conceptos, textos y frases. En los casos también tendrás que elegir por qué.</p><button class="primary" data-exam>Comenzar el reto →</button></div><div class="hero-art" aria-hidden="true"><div class="planet">⚑</div><span class="star s1">✦</span></div></section><div class="notice"><b>La nota va de 0 a 10.</b> Se calcula con todos los pasos: identificar y razonar. Una nota de 8 o más desbloquea la insignia del reto. No hay límite de intentos ni penalización en tus puntos por equivocarte.</div><p class="explain">Una buena nota en el reto es un logro. Para mostrar un concepto como dominado, necesitas resolver dos preguntas diferentes de ese concepto. Al terminar verás qué bloques conviene repasar.</p>${historyTable()}`;}
function questionSet(mode,ch){let pool=QUESTIONS.filter(q=>ch==='all'||q.chapter===ch);if(mode==='cases')pool=pool.filter(q=>q.kind==='aplicacion');if(mode==='review')pool=pool.filter(q=>state.review.includes(q.id));if(mode==='examen')return shuffle(CHAPTERS.flatMap(c=>{const p=QUESTIONS.filter(q=>q.chapter===c.id);return [...shuffle(p.filter(q=>q.kind==='concepto')).slice(0,1),...shuffle(p.filter(q=>q.kind==='aplicacion')).slice(0,4)];}));return shuffle(pool).sort((a,b)=>Number(state.passed.includes(a.id))-Number(state.passed.includes(b.id))).slice(0,10);}
function start(mode,ch='all'){if(state.session&&!confirm('Hay una misión en curso. ¿Quieres sustituirla por una nueva? Los puntos ya conseguidos se conservan.'))return;const qs=questionSet(mode,ch);if(!qs.length){toast('No hay preguntas pendientes en este bloque. Prueba otro.');return;}state.session={mode,ch,ids:qs.map(q=>q.id),index:0,phase:'identify',answer:null,checked:false,results:[],startXP:state.xp,choices:null};activity();save();location.hash='sesion';render();}
function optionsFor(q,reason=false){if(reason){let correct=q.reasonCorrect;let others=shuffle(QUESTIONS.filter(x=>x.chapter===q.chapter&&x.concept!==q.concept&&x.kind==='aplicacion')).map(x=>x.reasonCorrect);others=[...new Set(others)].filter(x=>x!==correct).slice(0,3);return shuffle([correct,...others]);}let pool=CONCEPTS.filter(c=>c.chapter===q.chapter&&c.id!==q.concept);return shuffle([q.concept,...shuffle(pool).slice(0,3).map(c=>c.id)]);}
function session(){const s=state.session;if(!s){location.hash='practica';return;}if(s.index>=s.ids.length){finish();return;}const q=qById(s.ids[s.index]);if(!q){state.session=null;save();location.hash='practica';return;}if(!s.choices)s.choices=optionsFor(q,s.phase==='reason');save();const reason=s.phase==='reason',correct=reason?q.reasonCorrect:q.concept;
main.innerHTML=`<div class="quiz-wrap"><div class="quiz-meta"><a href="#practica" class="link">← Guardar y salir</a><span>${s.mode==='examen'?'RETO FINAL':'LABORATORIO'} · ${chapterName(q.chapter)}</span><span>${s.index+1} / ${s.ids.length}</span></div><div class="bar" role="progressbar" aria-label="Progreso de la sesión" aria-valuenow="${s.index}" aria-valuemin="0" aria-valuemax="${s.ids.length}"><i style="width:${s.index/s.ids.length*100}%"></i></div><article class="quiz-card"><span class="chip">${q.kind==='concepto'?'▤ CONCEPTO':reason?'✧ PASO 2 · RAZONA':'⌕ PASO 1 · IDENTIFICA'}</span><h2>${esc(reason?'¿Qué pista demuestra la clasificación correcta?':q.prompt)}</h2><div class="question-text">${esc(q.text)}</div>${reason?`<p class="explain">La clasificación correcta es <b>${esc(byId(q.concept).name)}</b>. Elige la razón que encaja con este ejemplo.</p>`:''}<div class="answers ${reason?'reasons':''}">${s.choices.map((v,i)=>`<button class="answer ${s.answer===v?'chosen':''} ${s.checked&&v===correct?'correct':''} ${s.checked&&s.answer===v&&v!==correct?'wrong':''}" data-answer="${i}" ${s.checked?'disabled':''}>${s.checked&&v===correct?'✓ ':s.checked&&s.answer===v?'↻ ':String.fromCharCode(65+i)+'. '}${esc(reason?v:byId(v).name)}</button>`).join('')}</div>${s.checked?feedback(q,reason,s.answer===correct):''}<div class="quiz-actions"><span class="sub">${reason?'Reconocer + entender = aprender.':q.kind==='concepto'?'Piensa en la idea clave.':'Después, demostrarás por qué.'}</span>${s.checked?'<button class="primary" id="next">'+(!reason&&q.kind==='aplicacion'?'Vamos a razonar →':s.index===s.ids.length-1?'Ver mi resultado →':'Siguiente pregunta →')+'</button>':`<button class="primary" id="check" ${s.answer===null?'disabled':''}>Comprobar respuesta</button>`}</div></article></div>`;}
function feedback(q,reason,ok){let c=byId(q.concept),explanation=q.kind==='concepto'?c.why+' Ejemplo: '+c.example:reason?q.reason:'Ahora elige la pista del texto que demuestra esta clasificación.';return `<div class="feedback ${ok?'good':''}" role="status"><strong>${ok?(reason?'¡Has encontrado la prueba!':'¡Pista encontrada!'):'Esta pista te ayudará a avanzar.'}</strong>${!ok?'La respuesta correcta es <b>'+esc(reason?q.reasonCorrect:c.name)+'</b>. ':''}${esc(explanation)}${ok?'<br><small>Los puntos se conceden una vez por paso. Lo importante es que lo comprendas.</small>':''}</div>`;}
function check(){const s=state.session;if(!s||s.checked||s.answer===null)return;const q=qById(s.ids[s.index]),reason=s.phase==='reason',ok=s.answer===(reason?q.reasonCorrect:q.concept);s.checked=true;s.results.push({q:q.id,phase:s.phase,ok});state.attempts[q.id]=(state.attempts[q.id]||0)+1;if(ok)award(q.id+'-'+s.phase,10);else if(!state.review.includes(q.id))state.review.push(q.id);activity();save();session();}
function next(){const s=state.session,q=qById(s.ids[s.index]);if(!s.checked)return;if(s.phase==='identify'&&q.kind==='aplicacion'){s.phase='reason';}else{const results=s.results.filter(r=>r.q===q.id);if(results.every(r=>r.ok)&&results.length===(q.kind==='aplicacion'?2:1)){if(!state.passed.includes(q.id))state.passed.push(q.id);state.review=state.review.filter(id=>id!==q.id);}s.index++;s.phase='identify';}s.answer=null;s.checked=false;s.choices=null;save();session();}
let lastResult=null;
function finish(){const s=state.session,correct=s.results.filter(r=>r.ok).length,total=s.results.length;const h={date:new Date().toISOString(),mode:s.mode,score:Math.round(correct/total*100)/10,correct,total,questions:s.ids.length,xp:state.xp-s.startXP,results:s.results};state.history.unshift(h);state.history=state.history.slice(0,50);state.session=null;lastResult=h;save();result(h);}
function result(h){main.innerHTML=`<section class="results"><p class="eyebrow">MISIÓN COMPLETADA</p><h1>${h.score>=8?'¡Has conectado las pistas!':'Cada intento te hace avanzar.'}</h1><p class="sub">${h.score>=8?'Sigue explorando para afianzar lo que has aprendido.':'Ya sabes mejor dónde concentrar tu próxima misión.'}</p><div class="score-orb celebrate">${h.score.toLocaleString('es-ES')}<small>sobre 10</small></div><p>${h.correct} de ${h.total} pasos correctos · ${h.questions} preguntas</p><div class="stats"><div class="stat"><div><strong>+${h.xp}</strong><small>XP nuevos</small></div></div><div class="stat"><div><strong>${masteredIn()}</strong><small>conceptos dominados</small></div></div><div class="stat"><div><strong>${state.review.length}</strong><small>pistas para repasar</small></div></div></div><div class="result-buttons">${state.review.length?'<button class="primary" data-review>Repasar mis pistas →</button>':'<a class="primary" href="#practica">Seguir explorando →</a>'}<a class="secondary" href="#progreso">Ver mis logros</a></div></section><div class="section-heading"><h2>Tu mapa de esta misión</h2></div><div class="chapter-grid">${CHAPTERS.map(c=>{const rs=h.results.filter(r=>qById(r.q)?.chapter===c.id);if(!rs.length)return '';const n=rs.filter(r=>r.ok).length;return `<div class="chapter"><span class="tag">${c.name}</span><h3>${n} / ${rs.length} pasos correctos</h3><p>${n===rs.length?'Has resuelto todas las pistas de este bloque.':'Vuelve a las fichas y fíjate en las diferencias.'}</p><a class="link" href="#teoria/${c.id}">Repasar teoría →</a></div>`;}).join('')}</div>`;}
function historyTable(){if(!state.history.length)return '';return `<div class="section-heading"><h2>Tu recorrido</h2></div><table class="history"><thead><tr><th>Fecha</th><th>Misión</th><th>Nota / 10</th><th>Aciertos</th></tr></thead><tbody>${state.history.slice(0,10).map(h=>`<tr><td>${new Date(h.date).toLocaleDateString('es-ES')}</td><td>${h.mode==='examen'?'Reto final':h.mode==='review'?'Repaso':'Laboratorio'}</td><td><b>${h.score.toLocaleString('es-ES')}</b></td><td>${h.correct}/${h.total}</td></tr>`).join('')}</tbody></table>`;}
function progress(){main.innerHTML=`<p class="eyebrow">TU COLECCIÓN DE DESCUBRIMIENTOS</p><h1>Todo lo que estás consiguiendo.</h1><p class="sub">${level()} · Próximo nivel: ${state.xp>=1600?'¡Ya estás en el nivel más alto!':(400-state.xp%400)+' XP'}</p>${stats()}<div class="section-heading"><h2>Tu mapa de dominio</h2></div>${chapterCards()}<div class="mastery-list">${CONCEPTS.map(c=>`<span class="${mastered(c)?'done':''}">${mastered(c)?'✓':'○'} ${esc(c.name)}</span>`).join('')}</div><p class="explain">Un concepto está dominado cuando has resuelto al menos dos preguntas diferentes sobre él, incluida una aplicación práctica con su razonamiento correcto. Las fichas leídas tienen su propia recompensa.</p><div class="section-heading"><h2>Pequeñas grandes recompensas</h2></div><div class="badge-grid">${badgeData().map(b=>`<article class="badge ${b[3]?'':'locked'}"><span>${b[3]?b[0]:'◇'}</span><h3>${b[1]}</h3><p>${b[2]}</p><p>${b[3]?'✓ Desbloqueada':'Por descubrir'}</p></article>`).join('')}</div>${historyTable()}<details><summary>Cómo se calcula la puntuación</summary><p>5 XP por ficha leída, una sola vez. Hasta 10 XP por paso de pregunta resuelto correctamente, una sola vez. En los ejemplos se puntúan por separado la identificación y el razonamiento. La nota de cada misión refleja los pasos acertados en ese intento; no es la cantidad de XP ni el porcentaje de conceptos dominados.</p></details><details><summary>Gestionar el progreso</summary><p>El progreso se guarda en este navegador y en esta dirección web. No se sincroniza entre dispositivos. Usa la copia para trasladarlo o conservarlo.</p><button class="secondary" id="reset">Borrar mi progreso</button></details>`;}
function render(){const [route='inicio',arg]=location.hash.slice(1).split('/');document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.hash==='#'+route||(route==='sesion'&&a.hash==='#practica')));if(route==='teoria')theory(CHAPTERS.some(c=>c.id===arg)?arg:null);else if(route==='practica')practice();else if(route==='examen')exam();else if(route==='progreso')progress();else if(route==='sesion')session();else home();save();window.scrollTo(0,0);}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.read){const id=b.dataset.read;if(!state.read.includes(id)){state.read.push(id);activity();award('read-'+id,5);save();b.className='secondary';b.textContent='✓ Ficha leída';b.closest('article').classList.add('read');toast('Ficha descubierta · +5 XP. Ahora prueba a aplicarla.');}}else if(b.dataset.filter){document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('selected',x===b));}else if(b.dataset.mode){start(b.dataset.mode,$('[data-filter].selected')?.dataset.filter||'all');}else if(b.dataset.start){start('mix',b.dataset.start);}else if(b.hasAttribute('data-exam'))start('examen');else if(b.hasAttribute('data-review'))start('review');else if(b.dataset.answer!==undefined){const s=state.session;if(s&&!s.checked){s.answer=s.choices[+b.dataset.answer];save();session();}}else if(b.id==='check')check();else if(b.id==='next')next();else if(b.id==='reset'){if(confirm('¿Borrar todo tu progreso en este navegador? Guarda antes una copia si quieres recuperarlo.')){state=fresh();save();render();}}});
$('#export').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='malena-lengua-progreso.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
$('#import').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;if(file.size>2000000)throw Error();const d=JSON.parse(await file.text());const qids=new Set(QUESTIONS.map(q=>q.id)),cids=new Set(CONCEPTS.map(c=>c.id));if(d.version!==1||!Number.isFinite(d.xp)||d.xp<0||!['read','passed','earned','review','history','days'].every(k=>Array.isArray(d[k]))||!d.read.every(x=>cids.has(x))||!d.passed.every(x=>qids.has(x))||!d.review.every(x=>qids.has(x))||!d.days.every(x=>typeof x==='string')||!d.history.every(h=>Number.isFinite(h.score)&&typeof h.date==='string'&&Array.isArray(h.results)))throw Error();if(confirm('¿Sustituir el progreso actual por esta copia?')){state={...fresh(),...d,session:null};save();render();toast('Copia recuperada. Puedes seguir explorando.');}}catch(err){toast('La copia no es válida. Selecciona un archivo de progreso de esta aplicación.');}e.target.value='';};
window.addEventListener('hashchange',render);render();
</script></body></html>
